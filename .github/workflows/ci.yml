name: CI
on:
  push: { branches: [main] }
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  ci:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Both systems the repositories that use this crate run on. The HTTP transport binds a
        # socket, and a test that depends on loopback behaviour is exactly the kind that passes on
        # one system and not the other.
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}

      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      # `--all-features` on purpose: the HTTP transport is behind a feature flag, and a feature
      # that is never compiled in CI is a feature that is broken and nobody knows
      - run: cargo test --all-targets --all-features
      - run: cargo test --doc

  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo update --locked
